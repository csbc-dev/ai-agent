<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@wcstack/state — @csbc-dev/ai-agent (local mode)</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; color: #1a1a2e; background: #f4f5fa; }
      .app { width: min(680px, calc(100vw - 32px)); margin: 0 auto; padding: 32px 0 64px; }
      .hero h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -0.02em; }
      .hero p { margin: 0 0 20px; color: #5c5c7a; }
      .chat { background: #fff; border: 1px solid #e3e4ee; border-radius: 16px; box-shadow: 0 12px 36px rgba(26,26,46,.07); overflow: hidden; display: flex; flex-direction: column; min-height: 440px; }
      .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eef0f6; }
      .chat-head h2 { margin: 0; font-size: .95rem; }
      .badge { padding: 3px 10px; border-radius: 999px; background: #eef0ff; color: #4f46e5; font-size: .78rem; font-weight: 600; }
      .msgs { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
      .empty { margin: auto; color: #9092a8; text-align: center; }
      .msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
      .msg.user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
      .msg.assistant { align-self: flex-start; background: #f1f1fa; border-bottom-left-radius: 4px; }
      .role { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .55; margin-bottom: 3px; }
      .dot::after { content: "\25CF"; margin-left: 3px; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .err { margin: 0 18px 12px; padding: 10px 14px; border-radius: 12px; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
      .usage { display: flex; gap: 14px; padding: 12px 18px; border-top: 1px solid #eef0f6; font-size: .78rem; color: #5c5c7a; }
      .input { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid #eef0f6; }
      .input textarea { flex: 1; resize: none; border: 1px solid #e3e4ee; border-radius: 12px; padding: 10px 12px; font: inherit; outline: none; min-height: 44px; max-height: 140px; field-sizing: content; }
      .input textarea:focus { border-color: #6366f1; }
      .input button { border: 0; background: #6366f1; color: #fff; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
      .input button:disabled { opacity: .5; cursor: not-allowed; }
    </style>

    <!-- CDN-loaded — no bundler. Both packages register their custom
         elements as a side effect of the /auto entrypoint. -->
    <script type="module" src="https://esm.run/@wcstack/state/auto"></script>
    <script type="module" src="https://esm.run/@csbc-dev/ai-agent/auto"></script>
  </head>
  <body>
    <!-- The reactive store. wcstack/state applies the `data-wcs` bindings on
         following siblings (the <ai-agent> element and <main>). -->
    <wcs-state>
      <script type="module">
        // Flatten AiContent (string | AiContentPart[]) to plain text — the
        // same logic the vanilla/react/vue clients use in their `textOf()`.
        function textOf(content) {
          if (typeof content === "string") return content;
          if (!Array.isArray(content)) return String(content ?? "");
          return content.filter((p) => p.type === "text").map((p) => p.text).join("\n");
        }

        export default {
          // Input box value (two-way bound to the textarea).
          inputText: "",
          // Prompt pushed to <ai-agent>. Set just before the trigger fires.
          userInput: "",
          // Setting this true flips <ai-agent>'s `trigger` property, which
          // calls send(). <ai-agent> resets `trigger` to false when the run
          // settles, and the binding mirrors that back here.
          sendRequested: false,

          // <ai-agent> output state, mirrored in by the bindings below.
          assistantText: "",
          chatHistory: [],
          isLoading: false,
          isStreaming: false,
          aiError: null,
          usage: null,

          get displayMessages() {
            // Flatten each message's `content` to a string so the
            // `textContent: displayMessages.*.content` binding never renders
            // "[object Object]" for a multimodal AiContentPart[] value. This
            // mirrors the `textOf()` helper used by the vanilla/react/vue
            // clients, keeping all four examples consistent.
            return this.chatHistory
              .filter((m) => m.role === "user" || m.role === "assistant")
              .map((m) => ({ ...m, content: textOf(m.content) }));
          },
          get hasMessages() { return this.displayMessages.length > 0; },
          // During streaming the assistant turn is not in `messages` yet —
          // show the live `content` until it settles.
          get showStreaming() { return this.isStreaming && this.assistantText !== ""; },
          get showEmpty() { return !this.hasMessages && !this.showStreaming; },
          get canSend() { return this.inputText.trim() !== "" && !this.isLoading; },

          get hasUsage() { return this.usage !== null; },
          get promptTokens() { return this.usage?.promptTokens ?? 0; },
          get completionTokens() { return this.usage?.completionTokens ?? 0; },
          get totalTokens() { return this.usage?.totalTokens ?? 0; },

          get errorMessage() {
            const e = this.aiError;
            if (!e) return "";
            // `error` is `AiHttpError | Error`. An Error has `message`; an
            // AiHttpError carries the readable text in `body` (with
            // `statusText` as a fallback when the body is empty). Avoid
            // String(e) collapsing an AiHttpError to "[object Object]".
            return e.message || e.body || e.statusText || String(e);
          },

          sendMessage() {
            const text = this.inputText.trim();
            if (!text || this.isLoading) return;
            // Order matters: `prompt` must be set before `trigger` fires.
            // The `data-wcs` string on <ai-agent> lists `prompt` before
            // `trigger`, and wcstack/state applies bindings in that order.
            this.userInput = text;
            this.inputText = "";
            this.sendRequested = true;
          },

          handleKeydown(e) {
            // Ignore Enter while an IME is composing (e.g. confirming a
            // Japanese conversion) so it does not send the half-typed
            // message. keyCode 229 is the older-browser fallback.
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              this.sendMessage();
            }
          },
        };
      </script>
    </wcs-state>

    <!--
      Headless I/O node — no UI of its own.

      Edit `provider` / `model` / `base-url` for your endpoint. For local
      development you can add `api-key="..."` (dev only — it is visible in
      the DOM); in production point `base-url` at a backend proxy that
      injects the key server-side.

      The `data-wcs` string wires the store to the element:
        - `prompt` / `trigger` are inputs driven by the store.
        - `content` / `messages` / `loading` / `streaming` / `error` / `usage`
          are outputs mirrored back into the store.
    -->
    <ai-agent
      id="ai"
      provider="openai"
      model="gemma3:4b"
      base-url="http://localhost:11434"
      data-wcs="
        prompt:    userInput;
        trigger:   sendRequested;
        content:   assistantText;
        messages:  chatHistory;
        loading:   isLoading;
        streaming: isStreaming;
        error:     aiError;
        usage:     usage
      ">
    </ai-agent>

    <main>
      <div class="app">
        <div class="hero">
          <h1>@wcstack/state — @csbc-dev/ai-agent</h1>
          <p><code>data-wcs</code> declarative bindings wire <code>&lt;ai-agent&gt;</code> into a <code>&lt;wcs-state&gt;</code> store. CDN-loaded, no bundler.</p>
        </div>

        <div class="chat">
          <div class="chat-head">
            <h2>Chat</h2>
            <!-- Keep this in sync with the `model` attribute above. -->
            <span class="badge">gemma3:4b</span>
          </div>

          <div class="msgs">
            <template data-wcs="if: showEmpty">
              <div class="empty">Type a message and hit Send.<br />The assistant streams its reply.</div>
            </template>

            <template data-wcs="for: displayMessages">
              <div>
                <template data-wcs="if: displayMessages.*.role|equals(user)">
                  <div class="msg user">
                    <div class="role">You</div>
                    <div data-wcs="textContent: displayMessages.*.content"></div>
                  </div>
                </template>
                <template data-wcs="if: displayMessages.*.role|equals(assistant)">
                  <div class="msg assistant">
                    <div class="role">Assistant</div>
                    <div data-wcs="textContent: displayMessages.*.content"></div>
                  </div>
                </template>
              </div>
            </template>

            <template data-wcs="if: showStreaming">
              <div class="msg assistant">
                <div class="role">Assistant <span class="dot"></span></div>
                <div data-wcs="textContent: assistantText"></div>
              </div>
            </template>
          </div>

          <template data-wcs="if: aiError">
            <p class="err" data-wcs="textContent: errorMessage"></p>
          </template>

          <template data-wcs="if: hasUsage">
            <div class="usage">
              <span>prompt <span data-wcs="textContent: promptTokens"></span></span>
              <span>completion <span data-wcs="textContent: completionTokens"></span></span>
              <span>total <span data-wcs="textContent: totalTokens"></span></span>
            </div>
          </template>

          <div class="input">
            <textarea
              rows="1"
              placeholder="Message…"
              data-wcs="value: inputText; onkeydown: handleKeydown"
            ></textarea>
            <button data-wcs="onclick: sendMessage; disabled: canSend|not">Send</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
